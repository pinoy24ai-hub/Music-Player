<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prof Elf Music</title>
  <meta name="description" content="Original songs in English, Tagalog, and Cebuano by Prof Elf.">
  <meta property="og:title"       content="Prof Elf Music">
  <meta property="og:description" content="Original songs in English, Tagalog, and Cebuano.">
  <meta property="og:url"         content="https://songs.prof-elf.org">
  <meta property="og:type"        content="website">
  <meta property="og:image"       content="https://songs.prof-elf.org/og-cover.jpg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Prof Elf Music">
  <meta name="twitter:description" content="Original songs in English, Tagalog, and Cebuano.">
  <meta name="twitter:image"       content="https://songs.prof-elf.org/og-cover.jpg">
  <meta name="theme-color"        content="#0a1f2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset & Tokens ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #060f18;
      --bg-card:      rgba(10, 28, 46, 0.88);
      --bg-player:    rgba(4, 14, 24, 0.97);
      --border:       rgba(56, 140, 180, 0.35);
      --border-soft:  rgba(56, 140, 180, 0.18);
      --text:         #d4eaf5;
      --text-muted:   #6ba4c4;
      --text-light:   #a8d0e8;
      --accent:       #38c9e8;
      --accent-soft:  #6ddaf0;
      --accent-warm:  #f0c060;
      --accent-sea:   #2ab8a0;
      --playing-bg:   rgba(8, 36, 56, 0.97);
      --row-odd:      rgba(10, 28, 46, 0.80);
      --row-even:     rgba(6, 18, 32, 0.75);
      --radius:       14px;
      --radius-sm:    9px;
      --shadow:       0 4px 24px rgba(0,0,0,0.6);
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── Background ───────────────────────────────────────────────── */
    .bg-photo {
      position: fixed;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      z-index: -2;
      pointer-events: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(4, 14, 28, 0.82) 0%,
        rgba(6, 18, 36, 0.78) 40%,
        rgba(4, 12, 22, 0.88) 100%
      );
      z-index: -1;
      pointer-events: none;
    }

    /* Subtle wave decoration */
    .bg-wave {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 220px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Header ───────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, rgba(8, 30, 52, 0.94) 0%, rgba(4, 16, 28, 0.94) 100%);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-bottom: 1px solid var(--border);
      color: #fff;
      padding: 1.5rem 1.25rem 1.25rem;
      position: relative;
      z-index: 1;
    }

    .header-inner { max-width: 800px; margin: 0 auto; }

    .site-name {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--text);
    }

    .site-name em {
      font-style: italic;
      color: var(--accent-warm);
    }

    .tagline {
      font-size: 0.8rem;
      font-weight: 300;
      color: rgba(168, 208, 232, 0.75);
      margin-top: 0.35rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .header-bottom {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.48rem 0.9rem;
      border-radius: 20px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .yt-btn:hover {
      background: var(--accent);
      color: #04101c;
    }

    .yt-icon { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }

    #sotdBtn .sotd-title {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--accent-warm);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .v2-badge {
      font-size: 0.65rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-sea), var(--accent));
      color: #04101c;
      padding: 0.25rem 0.6rem;
      border-radius: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ─── Main Layout ──────────────────────────────────────────────── */
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 10rem;
      position: relative;
      z-index: 1;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    /* ─── Volume Browser ───────────────────────────────────────────── */
    #volumeBrowser { margin-bottom: 1.5rem; }

    .volume-cards-row {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: none;
    }

    .volume-cards-row::-webkit-scrollbar { display: none; }

    .vol-card {
      flex-shrink: 0;
      min-width: 118px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 0.75rem 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
      text-align: left;
      box-shadow: 0 2px 14px rgba(0,0,0,0.45);
    }

    .vol-card:hover {
      border-color: var(--accent);
      background: rgba(12, 36, 58, 0.92);
      box-shadow: 0 4px 20px rgba(56,201,232,0.15);
      transform: translateY(-1px);
    }

    .vol-card:active { transform: scale(0.97); }

    .vol-card.is-active {
      border-color: var(--accent);
      background: rgba(10, 34, 56, 0.94);
      box-shadow: 0 4px 18px rgba(56,201,232,0.2);
    }

    .vol-card-emoji { font-size: 1.3rem; margin-bottom: 0.35rem; display: block; }

    .vol-card-name {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }

    .vol-card.is-active .vol-card-name { color: var(--accent); }

    .vol-card-count {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 0.28rem;
    }

    /* ─── Active Volume Header ─────────────────────────────────────── */
    #activeVolHeader {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      background: var(--bg-card);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
    }

    #activeVolHeader.visible { display: flex; }

    .vol-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0.2rem;
      display: flex;
      align-items: center;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .vol-back-btn:hover { color: var(--accent); background: rgba(56,201,232,0.1); }

    .vol-header-info { flex: 1; min-width: 0; }
    .vol-header-emoji { font-size: 1.1rem; margin-right: 0.35rem; }
    .vol-header-name { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .vol-header-count { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.1rem; }

    .vol-shuffle-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 0.42rem 0.82rem;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vol-shuffle-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.6); }
    .vol-shuffle-btn:active,
    .vol-shuffle-btn.btn-fired { background: var(--accent); color: #04101c; border-color: var(--accent); transform: scale(0.96); box-shadow: 0 2px 16px rgba(56,201,232,0.55); }

    /* ─── Filter Row ───────────────────────────────────────────────── */
    .filter-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      min-width: 160px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    #clearSearch {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1;
      padding: 0 0.2rem;
      display: none;
    }
    #clearSearch:hover { color: var(--accent); }

    #searchInput {
      width: 100%;
      padding: 0.58rem 2rem 0.58rem 2.2rem;
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      font-size: 0.86rem;
      font-family: var(--font-body);
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #searchInput::placeholder { color: var(--text-muted); opacity: 1; }
    #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,201,232,0.1); }

    .lang-filters {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .lang-pill {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 0.4rem 0.72rem;
      font-size: 0.76rem;
      font-weight: 600;
      font-family: var(--font-body);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .lang-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56,201,232,0.07);
    }

    .lang-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #04101c;
    }

    /* ─── Shuffle Play Button ──────────────────────────────────────── */
    .shuffle-play-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 24px;
      padding: 0.62rem 1.15rem;
      font-size: 0.86rem;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      margin-bottom: 1.2rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: none;
    }

    .shuffle-play-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-1px);
    }

    .shuffle-play-btn:active,
    .shuffle-play-btn.btn-fired { background: var(--accent); color: #04101c; border-color: var(--accent); transform: scale(0.97); box-shadow: 0 2px 16px rgba(56,201,232,0.55); }

    /* ─── Song List ────────────────────────────────────────────────── */
    .song-list {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      box-shadow: 0 4px 28px rgba(0,0,0,0.5), 0 1px 0 rgba(56,140,180,0.12);
      overflow: hidden;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.88rem 1.1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .song-item:active { transform: scale(0.99); }
    .song-item:nth-child(odd)  { background: var(--row-odd); }
    .song-item:nth-child(even) { background: var(--row-even); }
    .song-item:last-child { border-bottom: none; }
    .song-item:hover { background: rgba(14, 44, 72, 0.92); }
    .song-item.is-playing { background: var(--playing-bg); }

    .song-num {
      width: 22px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .playing-icon {
      display: none;
      width: 26px;
      flex-shrink: 0;
      justify-content: center;
      align-items: center;
    }

    .song-item.is-playing .playing-icon { display: flex; }

    .bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }

    .bars span {
      display: block;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: bar-bounce 0.8s ease-in-out infinite alternate;
    }

    .bars span:nth-child(1) { height: 6px;  animation-delay: 0s; }
    .bars span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
    .bars span:nth-child(3) { height: 9px;  animation-delay: 0.3s; }
    .bars span:nth-child(4) { height: 14px; animation-delay: 0.1s; }

    @keyframes bar-bounce {
      from { transform: scaleY(0.35); }
      to   { transform: scaleY(1); }
    }

    .song-item.is-paused .bars span { animation-play-state: paused; }

    .song-info { flex: 1; min-width: 0; }

    .song-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item.is-playing .song-title { color: var(--accent); }

    .song-vol-tag {
      font-size: 0.66rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-dur {
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: right;
    }

    /* ─── Empty State ──────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* ─── Fixed Player ─────────────────────────────────────────────── */
    .player-wrap {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .player {
      width: 100%;
      max-width: 800px;
      background: var(--bg-player);
      color: var(--text-light);
      padding: 0.72rem 1.25rem 0.88rem;
      box-shadow: 0 -4px 32px rgba(0,0,0,0.7), 0 -1px 0 rgba(56,201,232,0.12);
      border-top: 2px solid var(--accent);
    }

    .player-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.52rem;
    }

    .player-track-info { flex: 1; min-width: 0; padding-right: 0.5rem; }

    .player-now-playing {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bg-badge {
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 0.15rem 0.42rem;
      border-radius: 6px;
      transition: all 0.25s;
    }

    .bg-badge.is-live {
      background: rgba(56,201,232,0.18);
      color: var(--accent);
      border: 1px solid rgba(56,201,232,0.35);
    }

    .bg-badge.is-recovering {
      background: rgba(240,192,96,0.18);
      color: var(--accent-warm);
      border: 1px solid rgba(240,192,96,0.35);
    }

    .player-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-vol-tag {
      font-size: 0.66rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── Progress ─────────────────────────────────────────────────── */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .time-label {
      font-size: 0.64rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      min-width: 28px;
    }

    .time-label.right { text-align: right; }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: visible;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-sea), var(--accent));
      border-radius: 4px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ─── Controls ─────────────────────────────────────────────────── */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
    }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      padding: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn:hover { color: var(--text); background: rgba(56,201,232,0.1); }
    .ctrl-btn:active { transform: scale(0.88); color: #04101c; background: var(--accent); box-shadow: 0 2px 12px rgba(56,201,232,0.5); }
    .ctrl-btn.is-active { color: var(--accent); background: rgba(56,201,232,0.15); box-shadow: 0 0 8px rgba(56,201,232,0.3); }
    .ctrl-btn.is-active:active { color: #04101c; background: var(--accent); }
    #shuffleBtn.is-active { color: var(--accent); background: rgba(56,201,232,0.18); box-shadow: 0 0 10px rgba(56,201,232,0.4); }
    #shuffleBtn.is-active:active { color: #04101c; background: var(--accent); }
    .ctrl-btn.repeat-one { color: var(--accent-warm); background: rgba(240,192,96,0.12); }

    .play-btn {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent-sea), var(--accent));
      color: #04101c;
      border-radius: 50%;
      box-shadow: 0 2px 16px rgba(56,201,232,0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s, filter 0.15s;
    }

    .play-btn:hover { opacity: 0.92; box-shadow: 0 4px 22px rgba(56,201,232,0.45); background: linear-gradient(135deg, var(--accent-sea), var(--accent)); color: #04101c; transform: scale(1.06); }
    .play-btn:active { transform: scale(0.93); filter: brightness(0.75); box-shadow: 0 1px 8px rgba(56,201,232,0.25); }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .vol-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      width: 30px;
      text-align: right;
    }

    .vol-slider {
      flex: 1;
      -webkit-appearance: none;

/* ─── AudioContext ────────────────────────────────────────────────── */
function ensureAudioContext() {
  if (_audioCtx) return;
  try {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    try {
      var silentBuf = _audioCtx.createBuffer(1, _audioCtx.sampleRate, _audioCtx.sampleRate);
      var silentSrc = _audioCtx.createBufferSource();
      silentSrc.buffer = silentBuf;
      silentSrc.loop   = true;
      var silentGain   = _audioCtx.createGain();
      silentGain.gain.value = 0.001;
      silentSrc.connect(silentGain);
      silentGain.connect(_audioCtx.destination);
      silentSrc.start(0);
    } catch(se) { console.warn('Silent loop failed:', se); }
    setTimeout(function() {
      if (currentIdx >= 0) updateMediaSession(SONGS[currentIdx]);
    }, 300);
  } catch(e) { console.warn('AudioContext setup failed:', e); }
}
document.addEventListener('click', ensureAudioContext, { once: true });

/* ─── Helpers ─────────────────────────────────────────────────────── */
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function safePlay(el) {
  var p = el.play();
  return (p && typeof p.then === 'function') ? p : Promise.resolve();
}

function armAutoplayUnlock() {
  if (autoplayUnlockArmed) return;
  autoplayUnlockArmed = true;
  ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function(type) {
    document.addEventListener(type, handleAutoplayUnlock);
  });
}

function disarmAutoplayUnlock() {
  if (!autoplayUnlockArmed) return;
  autoplayUnlockArmed = false;
  ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function(type) {
    document.removeEventListener(type, handleAutoplayUnlock);
  });
}

function markAutoplayBlocked(err) {
  autoplayBlocked = true;
  armAutoplayUnlock();
  if (err) console.warn('Autoplay blocked, waiting for first interaction:', err);
}

function getStartupTrackIndex() {
  var pool = getPoolIndices();
  if (pool.length === 0) return -1;
  if (!shuffleOn) return pool[0];
  return pool[Math.floor(Math.random() * pool.length)];
}

function handleAutoplayUnlock() {
  if (!autoplayBlocked || userPaused || isPlaying || trackChanging) {
    if (!autoplayBlocked || isPlaying) disarmAutoplayUnlock();
    return;
  }
  ensureAudioContext();
  if (currentIdx < 0) {
    var idx = getStartupTrackIndex();
    if (idx < 0) return;
    if (shuffleOn) buildShuffleQueue(idx);
    selectTrack(idx);
    return;
  }
  safePlay(audio).then(function() {
    autoplayBlocked = false;
    isPlaying = true;
    setBgBadge('live');
    updatePlayBtn();
    requestWakeLock();
    disarmAutoplayUnlock();
  }).catch(function(err) {
    console.warn('First-interaction resume failed:', err);
  });
}

function attemptAutoplayStart() {
  var idx = getStartupTrackIndex();
  if (idx < 0) return;
  if (shuffleOn) buildShuffleQueue(idx);
  selectTrack(idx);
}

function getPoolIndices() {
  return SONGS.reduce(function(acc, s, i) {
    var volOk  = (activeVolume < 0 || s.volIdx === activeVolume);
    var langOk = (activeLang === 'all' || s.lang === activeLang);
    var q      = searchInput.value.trim().toLowerCase();
    var srchOk = !q || s.title.toLowerCase().includes(q) ||
                 (VOLUMES[s.volIdx] && VOLUMES[s.volIdx].name.toLowerCase().includes(q));
    if (volOk && langOk && srchOk) acc.push(i);
    return acc;
  }, []);
}

/* ─── Volume Cards ────────────────────────────────────────────────── */
function buildVolumeCards() {
  volumeCardsRow.innerHTML = '';
  VOLUMES.forEach(function(v, vi) {
    var count = SONGS.filter(function(s) { return s.volIdx === vi; }).length;
    var card = document.createElement('button');
    card.className = 'vol-card' + (activeVolume === vi ? ' is-active' : '');
    card.innerHTML =
      '<span class="vol-card-emoji">' + v.emoji + '</span>' +
      '<div class="vol-card-name">' + v.name + '</div>' +
      '<div class="vol-card-count">' + count + ' songs</div>';
    card.addEventListener('click', function() {
      if (activeVolume === vi) {
        activeVolume = -1;
        activeVolHeader.classList.remove('visible');
      } else {
        activeVolume = vi;
        volHeaderEmoji.textContent = v.emoji + ' ';
        volHeaderName.textContent  = v.name;
        volHeaderCount.textContent = count + ' songs';
        activeVolHeader.classList.add('visible');
      }
      buildVolumeCards();
      renderList();
    });
    volumeCardsRow.appendChild(card);
  });
}

volBackBtn.addEventListener('click', function() {
  activeVolume = -1;
  activeVolHeader.classList.remove('visible');
  buildVolumeCards();
  renderList();
});

volShuffleBtn.addEventListener('click', function() {
  shuffleOn = true;
  shuffleBtn.classList.add('is-active');
  volShuffleBtn.classList.add('btn-fired');
  setTimeout(function() { volShuffleBtn.classList.remove('btn-fired'); }, 500);
  var pool = getPoolIndices();
  if (pool.length === 0) return;
  var idx = pool[Math.floor(Math.random() * pool.length)];
  buildShuffleQueue(idx);
  selectTrack(idx);
});

/* ─── Render List ─────────────────────────────────────────────────── */
function renderList() {
  var pool = getPoolIndices();
  songListEl.innerHTML = '';

  if (pool.length === 0) {
    songListEl.innerHTML = '<div class="empty-state">No songs match your filter.</div>';
    return;
  }

  // Group by volume when showing all
  var groups = {};
  pool.forEach(function(i) {
    var vi = SONGS[i].volIdx;
    if (!groups[vi]) groups[vi] = [];
    groups[vi].push(i);
  });

  // Sort songs within each group alphabetically by title
  Object.keys(groups).forEach(function(vi) {
    groups[vi].sort(function(a, b) {
      return SONGS[a].title.toLowerCase().localeCompare(SONGS[b].title.toLowerCase());
    });
  });

  var globalNum = 1;
  Object.keys(groups).sort(function(a, b) { return a - b; }).forEach(function(vi) {
    vi = parseInt(vi);
    var vol = VOLUMES[vi];

    // Section header when showing all volumes
    if (activeVolume < 0) {
      var hdr = document.createElement('div');
      hdr.className = 'vol-section-header';
      hdr.innerHTML =
        '<span class="vol-section-emoji">' + vol.emoji + '</span>' +
        '<span class="vol-section-name">' + vol.name + '</span>' +
        '<span class="vol-section-count">' + groups[vi].length + '</span>';
      songListEl.appendChild(hdr);
    }

    groups[vi].forEach(function(songIdx) {
      var s   = SONGS[songIdx];
      var row = document.createElement('div');
      row.className = 'song-item' +
        (currentIdx === songIdx ? ' is-playing' + (isPlaying ? '' : ' is-paused') : '');
      row.dataset.idx = songIdx;

      row.innerHTML =
        '<div class="song-num">' + (globalNum++) + '</div>' +
        '<div class="playing-icon"><div class="bars">' +
          '<span></span><span></span><span></span><span></span>' +
        '</div></div>' +
        '<div class="song-info">' +
          '<div class="song-title">' + s.title + '</div>' +
          '<div class="song-vol-tag">' + vol.name + ' &middot; ' +
            (s.lang === 'tl' ? 'Tagalog' : s.lang === 'ceb' ? 'Cebuano' : 'English') +
          '</div>' +
        '</div>' +
        '<div class="song-dur">' + (s.duration || '') + '</div>';

      row.addEventListener('click', function() { selectTrack(songIdx); });
      songListEl.appendChild(row);
    });
  });
}

/* ─── Select & Play ───────────────────────────────────────────────── */
function selectTrack(idx) {
  ensureAudioContext();
  var s = SONGS[idx];
  currentIdx  = idx;
  userPaused  = false;
  trackChanging = true;

  // Build the full R2 URL
  var url = r2(s.file);
  audio.src = url;
  audio.load();

  playerTitle.textContent  = s.title;
  playerVolTag.textContent = VOLUMES[s.volIdx].name + ' \u00b7 ' +
    (s.lang === 'tl' ? 'Tagalog' : s.lang === 'ceb' ? 'Cebuano' : 'English');

  safePlay(audio).then(function() {
    autoplayBlocked = false;
    disarmAutoplayUnlock();
    isPlaying     = true;
    trackChanging = false;
    setBgBadge('live');
    updatePlayBtn();
    updateMediaSession(s);
    requestWakeLock();
  }).catch(function(e) {
    console.warn('Play failed:', e);
    trackChanging = false;
    if (document.visibilityState === 'hidden') pendingPlay = true;
    if (!userPaused) markAutoplayBlocked(e);
  });

  renderList();
}

function updatePlayBtn() {
  iconPlay.style.display  = isPlaying ? 'none'  : 'block';
  iconPause.style.display = isPlaying ? 'block' : 'none';
}

/* ─── Play/Pause ──────────────────────────────────────────────────── */
playBtn.addEventListener('click', function() {
  ensureAudioContext();
  if (currentIdx < 0) {
    var pool = getPoolIndices();
    if (pool.length > 0) selectTrack(pool[0]);
    return;
  }
  if (audio.paused) {
    userPaused = false;
    safePlay(audio).then(function() {
      autoplayBlocked = false;
      disarmAutoplayUnlock();
      isPlaying = true;
      setBgBadge('live');
      updatePlayBtn();
      requestWakeLock();
    }).catch(function(e) {
      markAutoplayBlocked(e);
    });
  } else {
    audio.pause();
    isPlaying  = false;
    userPaused = true;
    setBgBadge('off');
    updatePlayBtn();
    releaseWakeLock();
  }
});

/* ─── Advance Track ───────────────────────────────────────────────── */
function advanceTrack(dir) {
  var poolIdxs = getPoolIndices();
  if (poolIdxs.length === 0) return;
  var pos = poolIdxs.indexOf(currentIdx);
  var nextIdx;
  if (dir > 0) {
    if (shuffleOn) {
      nextIdx = nextShuffleTrack();
    } else {
      nextIdx = pos >= 0 && pos + 1 < poolIdxs.length ? poolIdxs[pos + 1] : poolIdxs[0];
    }
  } else {
    nextIdx = pos > 0 ? poolIdxs[pos - 1] : poolIdxs[poolIdxs.length - 1];
  }
  selectTrack(nextIdx);
}

/* ─── Media Session ───────────────────────────────────────────────── */
function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', function() {
    if (currentIdx >= 0 && audio.paused) {
      userPaused = false;
      safePlay(audio).then(function() { isPlaying = true; setBgBadge('live'); updatePlayBtn(); });
    }
  });
  navigator.mediaSession.setActionHandler('pause', function() {
    audio.pause(); isPlaying = false; userPaused = true;
    setBgBadge('off'); updatePlayBtn(); releaseWakeLock();
  });
  navigator.mediaSession.setActionHandler('previoustrack', function() {
    if (currentIdx >= 0) advanceTrack(-1);
  });
  navigator.mediaSession.setActionHandler('nexttrack', function() {
    if (currentIdx >= 0) advanceTrack(1);
  });
  try {
    navigator.mediaSession.setActionHandler('seekto', function(d) {
      if (audio.duration && d.seekTime != null) audio.currentTime = d.seekTime;
    });
  } catch(e) {}
}

function updateMediaSession(s) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title:  s.title,
    artist: 'Prof Elf',
    album:  VOLUMES[s.volIdx].name
  });
  syncMediaSessionState();
}

function syncMediaSessionState() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  if (audio.duration && !isNaN(audio.duration)) {
    try {
      navigator.mediaSession.setPositionState({
        duration:     audio.duration,
        playbackRate: audio.playbackRate,
        position:     Math.min(audio.currentTime, audio.duration)
      });
    } catch(e) {}
  }
}
syncMediaSessionState._last = -1;

/* ─── Recovery & Wake Lock ────────────────────────────────────────── */
var _recoveryTimer = null;
var _recoveryCount = 0;

function setBgBadge(state) {
  bgBadge.classList.remove('is-live', 'is-recovering');
  if (state === 'live') {
    bgBadge.textContent = 'LIVE';
    bgBadge.classList.add('is-live');
  } else if (state === 'recovering') {
    bgBadge.textContent = 'RECONNECTING';
    bgBadge.classList.add('is-recovering');
  } else {
    bgBadge.textContent = '';
  }
}

function startRecovery() {
  if (_recoveryTimer || userPaused || currentIdx < 0) return;
  _recoveryCount = 0;
  setBgBadge('recovering');
  _recoveryTimer = setInterval(function() {
    if (userPaused || currentIdx < 0) { stopRecovery(); return; }
    if (!audio.paused)                { stopRecovery(); return; }
    if (_recoveryCount++ > 20)        { stopRecovery(); return; }
    if (audio.readyState >= 2) {
      safePlay(audio).catch(function() {});
    } else if (audio.src) {
      audio.load();
    }
  }, 1500);
}

function stopRecovery() {
  if (_recoveryTimer) { clearInterval(_recoveryTimer); _recoveryTimer = null; }
  _recoveryCount = 0;
  setBgBadge(isPlaying ? 'live' : 'off');
}

function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  if (_wakeLock && !_wakeLock.released) return;
  navigator.wakeLock.request('screen').then(function(sentinel) {
    _wakeLock = sentinel;
    sentinel.addEventListener('release', function() {
      _wakeLock = null;
      if (!userPaused && isPlaying) setTimeout(requestWakeLock, 1000);
    });
  }).catch(function() {});
}

function releaseWakeLock() {
  if (_wakeLock && !_wakeLock.released) { _wakeLock.release(); }
  _wakeLock = null;
}

/* ─── Visibility / Background playback ───────────────────────────── */
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    wasPlayingWhenHidden = !audio.paused && !userPaused;
  } else {
    if (_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
    if ((wasPlayingWhenHidden || pendingPlay) && !userPaused && currentIdx >= 0) {
      var url = r2(SONGS[currentIdx].file);
      if (audio.src !== url || audio.readyState < 2) {
        audio.src = url; audio.load();
        audio.addEventListener('canplay', function onWakeReady() {
          audio.removeEventListener('canplay', onWakeReady);
          safePlay(audio).catch(function(e) { console.warn('Wake canplay resume failed:', e); });
        });
      } else {
        safePlay(audio).catch(function(e) { console.warn('Wake resume failed:', e); });
      }
    }
    wasPlayingWhenHidden = false; pendingPlay = false;
    if (!userPaused && isPlaying) requestWakeLock();
    if (!userPaused && !isPlaying && currentIdx >= 0) startRecovery();
  }
});

window.addEventListener('resume', function() {
  if (_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
  if ((wasPlayingWhenHidden || pendingPlay) && !userPaused && currentIdx >= 0) {
    safePlay(audio).catch(function(e) { console.warn('Page lifecycle resume failed:', e); });
  }
});

setInterval(function() {
  if (_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
  if ((wasPlayingWhenHidden || pendingPlay) && !userPaused && currentIdx >= 0) {
    if (audio.readyState >= 2) {
      safePlay(audio).catch(function() {});
    } else if (!trackChanging && audio.src) {
      audio.load();
    }
  }
}, 3000);

/* ─── Progress Bar ────────────────────────────────────────────────── */
audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  var pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  currentTimeEl.textContent = fmtTime(audio.currentTime);
  var _sec = Math.floor(audio.currentTime);
  if (_sec !== syncMediaSessionState._last) { syncMediaSessionState._last = _sec; syncMediaSessionState(); }
  // Preload next track near end
  if (audio.duration - audio.currentTime < 60) {
    var poolIdxs = getPoolIndices();
    var pos = poolIdxs.indexOf(currentIdx);
    var nextIdx = shuffleOn && shuffleQueue.length > 0 ? shuffleQueue[0]
      : (pos >= 0 && pos + 1 < poolIdxs.length ? poolIdxs[pos + 1] : -1);
    if (nextIdx >= 0) {
      var nextUrl = r2(SONGS[nextIdx].file);
      if (preloadAudio.src !== nextUrl) {
        preloadAudio.src = nextUrl; preloadAudio.preload = 'auto'; preloadAudio.load();
      }
    }
  }
});

audio.addEventListener('loadedmetadata', function() {
  totalTimeEl.textContent = fmtTime(audio.duration);
  syncMediaSessionState();
});

progressBar.addEventListener('click', function(e) {
  if (!audio.duration) return;
  var rect = progressBar.getBoundingClientRect();
  var pct  = (e.clientX - rect.left) / rect.width;
  if (pct < 0) pct = 0; if (pct > 1) pct = 1;
  audio.currentTime = pct * audio.duration;
});

/* ─── Repeat ──────────────────────────────────────────────────────── */
function updateRepeatBtn() {
  var labels = ['Repeat: off', 'Repeat: all', 'Repeat: one'];
  repeatBtn.title = labels[repeatMode];
  repeatBtn.classList.toggle('is-active', repeatMode > 0);
  repeatBtn.classList.toggle('repeat-one', repeatMode === 2);
}

repeatBtn.addEventListener('click', function() {

  updateRepeatBtn();

/* ─── Volume ──────────────────────────────────────────────────────── */
audio.volume = 0.8;
volSlider.style.setProperty('--vol-pct', '80%');

function updateVolIcons(vol) {
  iconVolHigh.style.display = (vol > 40)             ? 'block' : 'none';
  iconVolLow.style.display  = (vol > 0 && vol <= 40) ? 'block' : 'none';
  iconVolMute.style.display = (vol === 0)             ? 'block' : 'none';
}

function setVolume(val) {
  var v = Math.max(0, Math.min(100, Math.round(val)));
  audio.volume = v / 100;
  volSlider.value = v;
  volSlider.style.setProperty('--vol-pct', v + '%');

}

volSlider.addEventListener('input', function() {

});

muteBtn.addEventListener('click', function() {

  else                  { setVolume(lastVolume); }
});

updateVolIcons(80);

/* ─── Shuffle ─────────────────────────────────────────────────────── */
function buildShuffleQueue(excludeIdx) {
  var poolIdxs = getPoolIndices();
  var pool = poolIdxs.filter(function(i) { return i !== excludeIdx; });
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  shuffleQueue = pool;
}

function nextShuffleTrack() {
  if (shuffleQueue.length === 0) buildShuffleQueue(currentIdx);
  return shuffleQueue.shift();
}

shuffleBtn.addEventListener('click', function() {
  shuffleOn = !shuffleOn;
  shuffleBtn.classList.toggle('is-active', shuffleOn);
  shuffleBtn.title = shuffleOn ? 'Shuffle: on' : 'Shuffle: off';
  if (shuffleOn) buildShuffleQueue(currentIdx);
});

shufflePlayBtn.addEventListener('click', function() {
  shuffleOn = true;
  shuffleBtn.classList.add('is-active');
  shufflePlayBtn.classList.add('btn-fired');
  setTimeout(function() { shufflePlayBtn.classList.remove('btn-fired'); }, 500);
  var pool = getPoolIndices();
  if (pool.length === 0) return;
  var idx = pool[Math.floor(Math.random() * pool.length)];
  buildShuffleQueue(idx);
  selectTrack(idx);
});

/* ─── Prev / Next ─────────────────────────────────────────────────── */
prevBtn.addEventListener('click', function() {
  if (currentIdx < 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; }
  else                       { advanceTrack(-1); }
});

nextBtn.addEventListener('click', function() {
  if (currentIdx < 0) return;
  advanceTrack(1);
});

/* ─── Search & Filter ─────────────────────────────────────────────── */
searchInput.addEventListener('input', function() {
  document.getElementById('clearSearch').style.display = searchInput.value ? 'block' : 'none';
  renderList();
});
document.getElementById('clearSearch').addEventListener('click', function() {
  searchInput.value = '';
  this.style.display = 'none';
  searchInput.focus();
  renderList();
});

document.querySelectorAll('.lang-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.lang-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeLang = pill.dataset.lang;
    renderList();
  });
});

/* ─── Auto-advance ────────────────────────────────────────────────── */
audio.addEventListener('ended', function() {
  if (repeatMode === 2) {
    audio.currentTime = 0;
    safePlay(audio).catch(function(err) {
      console.warn('Repeat-one blocked:', err);
      if (document.visibilityState === 'hidden') pendingPlay = true;
    });
    return;
  }
  var poolIdxs = getPoolIndices();
  var pos = poolIdxs.indexOf(currentIdx);
  var nextIdx;
  if (shuffleOn) {
    nextIdx = nextShuffleTrack();
  } else if (repeatMode === 1) {
    nextIdx = pos >= 0 ? poolIdxs[(pos + 1) % poolIdxs.length] : poolIdxs[0];
  } else {
    if (pos >= 0 && pos + 1 < poolIdxs.length) {
      nextIdx = poolIdxs[pos + 1];
    } else {
      return;
    }
  }
  selectTrack(nextIdx);
});

/* ─── Song of the Day ─────────────────────────────────────────────── */
function getSotdIndex() {
  var now  = new Date();
  var seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  // Math.imul gives proper 32-bit integer multiplication — no float drift
  var x = seed | 0;
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = x ^ (x >>> 16);
  return Math.abs(x) % SONGS.length;
}

function initSotd() {
  var idx = getSotdIndex();
  var btn = document.getElementById('sotdBtn');
  // Use onclick to replace any previous handler — prevents stacking on midnight refresh
  btn.onclick = function() {
    activeVolume = -1;
    activeVolHeader.classList.remove('visible');
    buildVolumeCards();
    renderList();
    selectTrack(idx);
    setTimeout(function() {
      var el = document.querySelector('.song-item.is-playing');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  };
  // Schedule a single refresh at the next midnight
  var now = new Date();
  var msToMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
  setTimeout(initSotd, msToMidnight);
}

/* ─── Latest Drop ─────────────────────────────────────────────────── */
function initLatestDrop() {
  var latestIdx = -1;
  var latestTs = -Infinity;
  SONGS.forEach(function(s, i) {
    if (!s.added) return;
    var ts = Date.parse(s.added);
    if (isNaN(ts)) return;
    if (ts > latestTs) {
      latestTs = ts;
      latestIdx = i;
    }
  });
  document.getElementById('latestDropBtn').addEventListener('click', function() {
    if (latestIdx < 0) return;
    activeVolume = -1;
    activeVolHeader.classList.remove('visible');
    buildVolumeCards();
    renderList();
    selectTrack(latestIdx);
    setTimeout(function() {
      var el = document.querySelector('.song-item.is-playing');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  });
}

/* ─── Init ────────────────────────────────────────────────────────── */
initMediaSession();
buildVolumeCards();
renderList();
initSotd();
initLatestDrop();
attemptAutoplayStart();

</script>
</body>
